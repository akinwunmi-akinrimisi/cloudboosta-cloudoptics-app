[project]
name = "cloudoptics-api"
version = "0.1.0"
description = "Cloudoptics backend (API, workers, engines) - modular monolith"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "boto3>=1.35",
    "cryptography>=43",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "procrastinate>=3.0",
    "pyarrow>=17",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=24.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudoptics"]
