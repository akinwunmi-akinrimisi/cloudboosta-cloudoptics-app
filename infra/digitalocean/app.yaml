# Cloudoptics staging on DigitalOcean App Platform (ADR-013). Applied by provision.py, which
# replaces the __PLACEHOLDERS__ with secrets read from the DigitalOcean API (never committed).
name: cloudoptics-staging
region: lon

domains:
  - domain: cloudoptics.cloudboosta.com
    type: PRIMARY
    zone: cloudboosta.com

# Alert rules (WBS OPS-7). Names from the App Platform app spec reference. The spec holds
# no recipients: provision.py assigns ALERT_EMAILS to every rule after it applies the spec
# (docs/11g RB-05, RB-08). They change only when Staging setup runs.
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# One origin, split by path (ADR-016 layout H1, docs/14 §7.2, SITE-13): the API at /api, the
# app at /app, the demo at /demo and the public site (with /cfn/* templates) at /. App Platform
# trims the matched prefix before it forwards a request (preserve_path_prefix: false), so the
# app and the demo are built with VITE_BASE=/app/ and /demo/ but their files sit at the root of
# their own build. Old app paths (/overview, ...) reach the site, whose 404 page forwards them.
ingress:
  rules:
    - match: { path: { prefix: /api } }
      component: { name: api, preserve_path_prefix: false }
    - match: { path: { prefix: /app } }
      component: { name: web, preserve_path_prefix: false }
    - match: { path: { prefix: /demo } }
      component: { name: demo, preserve_path_prefix: false }
    - match: { path: { prefix: / } }
      component: { name: site }

services:
  - name: api
    image: &image
      registry_type: GHCR
      registry: akinwunmi-akinrimisi
      repository: cloudoptics-api
      tag: main
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    instance_count: 1
    http_port: 8000
    health_check:
      http_path: /readyz
      initial_delay_seconds: 10
      period_seconds: 15
    alerts:
      - &alert_cpu { rule: CPU_UTILIZATION, operator: GREATER_THAN, value: 80, window: TEN_MINUTES }
      - &alert_mem { rule: MEM_UTILIZATION, operator: GREATER_THAN, value: 85, window: TEN_MINUTES }
      - &alert_restarts { rule: RESTART_COUNT, operator: GREATER_THAN, value: 2, window: THIRTY_MINUTES }
      - { rule: REQUEST_DURATION_P95_MS, operator: GREATER_THAN, value: 2000, window: TEN_MINUTES }
    envs:
      - &env_environment { key: CLOUDOPTICS_ENVIRONMENT, value: staging }
      - &env_auth { key: CLOUDOPTICS_AUTH_MODE, value: oidc }
      - &env_jobs { key: CLOUDOPTICS_JOBS_MODE, value: queue }
      - &env_app_db
        key: CLOUDOPTICS_APP_DATABASE_URL
        type: SECRET
        value: __APP_DATABASE_URL__
      - &env_data_key
        key: CLOUDOPTICS_LOCAL_DATA_KEY
        type: SECRET
        value: __LOCAL_DATA_KEY__
      # Links in emails go to the app under /app. The stack callback goes to the API, set
      # explicitly: derived from the app URL it would become .../app/api (docs/14 §7.2 item 3).
      - &env_app_url { key: CLOUDOPTICS_APP_URL, value: https://cloudoptics.cloudboosta.com/app }
      - &env_api_url { key: CLOUDOPTICS_API_PUBLIC_URL, value: https://cloudoptics.cloudboosta.com/api }
      - key: CLOUDOPTICS_CORS_ORIGINS
        value: '["https://cloudoptics.cloudboosta.com"]'
      # Served by the site component (apps/site/scripts/copy-templates.mjs).
      - key: CLOUDOPTICS_CFN_TEMPLATE_DOWNLOAD_BASE
        value: https://cloudoptics.cloudboosta.com/cfn

workers:
  - name: worker
    image: *image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    run_command: python -m cloudoptics.worker
    # A busy worker runs hot by design (bill loads), so CPU alerts only when it stays high.
    alerts:
      - { rule: CPU_UTILIZATION, operator: GREATER_THAN, value: 90, window: ONE_HOUR }
      - *alert_mem
      - *alert_restarts
    envs: [*env_environment, *env_auth, *env_jobs, *env_app_db, *env_data_key, *env_app_url, *env_api_url]

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    image: *image
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: alembic -c apps/api/alembic.ini upgrade head
    envs:
      - *env_environment
      - *env_auth
      - *env_jobs
      - *env_app_db
      - *env_data_key
      - key: CLOUDOPTICS_DATABASE_URL
        type: SECRET
        value: __OWNER_DATABASE_URL__

static_sites:
  # The public site at /: real 404s (error_document), never a catch-all.
  - name: site
    git: &git
      repo_clone_url: https://github.com/akinwunmi-akinrimisi/cloudboosta-cloudoptics-app.git
      branch: main
    dockerfile_path: apps/site/Dockerfile
    output_dir: /src/apps/site/dist
    error_document: 404.html
    envs:
      - key: SITE_URL
        value: https://cloudoptics.cloudboosta.com
        scope: BUILD_TIME
  # The app at /app: every path that is not a file gets index.html (client-side routes).
  - name: web
    git: *git
    dockerfile_path: apps/web/Dockerfile
    output_dir: /src/apps/web/dist
    catchall_document: index.html
    envs:
      - key: VITE_API_URL
        value: /api
        scope: BUILD_TIME
      - key: VITE_BASE
        value: /app/
        scope: BUILD_TIME
  # The demo at /demo (SITE-14): sample data in the browser, no API calls, noindex, no analytics.
  - name: demo
    git: *git
    dockerfile_path: apps/web/Dockerfile
    output_dir: /src/apps/web/dist
    catchall_document: index.html
    envs:
      - key: VITE_API_MODE
        value: demo
        scope: BUILD_TIME
      - key: VITE_BASE
        value: /demo/
        scope: BUILD_TIME
