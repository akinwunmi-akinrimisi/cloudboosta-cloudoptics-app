AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Cloudoptics stage 2 (optional, per account): read-only access to resource metadata and
  metrics, used for recommendations. Deploy in each account directly or with a StackSet.
  No write or data-plane permissions (no S3 object reads, no secrets). PRD FR-CON-03/13.

Metadata:
  cloudoptics:
    templateVersion: "1.0.2"

Parameters:
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 128
    AllowedPattern: "[\\w+=,.@:/-]+"
  CloudopticsPrincipalArn:
    Type: String
    AllowedPattern: "arn:aws:iam::[0-9]{12}:role/[\\w+=,.@-]+"
  RoleName:
    Type: String
    Default: CloudopticsResourceReadOnly
    AllowedValues: [CloudopticsResourceReadOnly, CloudopticsResourceReader]
    Description: CloudopticsResourceReader when rolled out by the single cloudoptics-access stack.

Resources:
  ResourceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read-only resource metadata and metrics for Cloudoptics. No write actions.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref CloudopticsPrincipalArn }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { sts:ExternalId: !Ref ExternalId }
      Policies:
        - PolicyName: cloudoptics-resource-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Inventory
                Effect: Allow
                Action:
                # Metadata only: no ec2:Describe* or autoscaling:Describe* (user data in instance
                # attributes, launch templates and launch configurations), no Lambda configuration
                # (environment variables) and no DNS records, which can hold secrets.
                  - ec2:DescribeRegions
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeVolumes
                  - ec2:DescribeVolumeStatus
                  - ec2:DescribeVolumesModifications
                  - ec2:DescribeSnapshots
                  - ec2:DescribeImages
                  - ec2:DescribeAddresses
                  - ec2:DescribeNatGateways
                  - ec2:DescribeReservedInstances
                  - ec2:DescribeTags
                  - rds:Describe*
                  - rds:ListTagsForResource
                  - elasticloadbalancing:Describe*
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - logs:DescribeLogGroups
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketTagging
                  - s3:GetLifecycleConfiguration
                  - s3:GetIntelligentTieringConfiguration
                  - tag:GetResources
                Resource: "*"
              - Sid: Metrics
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                Resource: "*"
              - Sid: AwsNativeRecommendations
                Effect: Allow
                Action:
                  - compute-optimizer:Get*
                  - compute-optimizer:Describe*
                  - cost-optimization-hub:Get*
                  - cost-optimization-hub:List*
                  # Compute Optimizer's ECS service findings need these.
                  - ecs:ListClusters
                  - ecs:ListServices
                Resource: "*"

Outputs:
  RoleArn:
    Value: !GetAtt ResourceRole.Arn
