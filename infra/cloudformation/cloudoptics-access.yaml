AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Cloudoptics access, one stack for everything (PRD FR-CON-02/03/13): read-only billing
  access, the CUR 2.0 bill export, read-only resource access in this account and, in an
  AWS Organization's management account, the resource role in every member account
  (including accounts added later). Deploy in us-east-1. Update this stack in place when
  Cloudoptics publishes a new version; it replaces the older Cloudoptics stacks.

Metadata:
  cloudoptics:
    templateVersion: "2.0.0"
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Connection (pre-filled by Cloudoptics) }
        Parameters:
          [ExternalId, CloudopticsPrincipalArn, ResourceTemplateUrl, CallbackUrl, ConnectionRef, TenantId]

Parameters:
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 128
    AllowedPattern: "[\\w+=,.@:/-]+"
    Description: Unique to your Cloudoptics workspace. Do not reuse.
  CloudopticsPrincipalArn:
    Type: String
    AllowedPattern: "arn:aws:iam::[0-9]{12}:role/[\\w+=,.@-]+"
    Description: The Cloudoptics role allowed to assume the read-only roles.
  ResourceTemplateUrl:
    Type: String
    AllowedPattern: "https://.+/resource-role\\.yaml"
    Description: The resource role template that member accounts get.
  CallbackUrl:
    Type: String
    AllowedPattern: "https?://.+/v1/cfn/callback"
    Description: Where the setup step tells Cloudoptics that this stack is ready.
  ConnectionRef:
    Type: String
    AllowedPattern: "[ic]:[0-9a-f-]{36}"
    Description: The Cloudoptics connection this stack belongs to.
  TenantId:
    Type: String
    AllowedPattern: "[0-9a-f-]{36}"
    Description: Your Cloudoptics workspace.
  CurPrefix:
    Type: String
    Default: cloudoptics
    AllowedPattern: "[a-zA-Z0-9!_.*'()/-]+"

Resources:
  # The setup step's own role. It runs only while this stack is created, updated or deleted;
  # Cloudoptics never assumes it. Write actions are limited to Cloudoptics-named resources.
  # trivy:ignore:AVD-AWS-0057
  SetupRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets the Cloudoptics setup step manage Cloudoptics resources in this account.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: cloudoptics-setup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OldCloudopticsStacks
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:DeleteStack]
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/cloudoptics-billing-access/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/cloudoptics-resource-access/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/cloudoptics-resource-stackset/*"
              # What deleting the old stacks removes: their roles, export, bucket policy and
              # the old StackSet setup function.
              - Sid: OldStackResources
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:DetachRolePolicy
                  - iam:ListInstanceProfilesForRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudopticsBillingReadOnly"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CloudopticsResourceReadOnly"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cloudoptics-resource-stackset-*"
              - Sid: OldSetupFunction
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:cloudoptics-resource-stackset-*"
              - Sid: BillExport
                Effect: Allow
                Action:
                  - bcm-data-exports:GetExport
                  - bcm-data-exports:DeleteExport
                  - bcm-data-exports:ListExports
                Resource: "*"
              - Sid: ExportBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:ListBucket
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketOwnershipControls
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                Resource: !Sub "arn:${AWS::Partition}:s3:::cloudoptics-cur-${AWS::AccountId}"
              # These Organizations and CloudFormation actions have no resource-level scope.
              - Sid: TrustedAccessAndRoot
                Effect: Allow
                Action:
                  - cloudformation:ListStacks
                  - cloudformation:ActivateOrganizationsAccess
                  - cloudformation:DescribeOrganizationsAccess
                  - organizations:EnableAWSServiceAccess
                  - organizations:ListAWSServiceAccessForOrganization
                  - organizations:DescribeOrganization
                  - organizations:ListRoots
                  - organizations:ListAccounts
                  - organizations:ListAccountsForParent
                  - organizations:ListChildren
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:ListDelegatedAdministrators
                Resource: "*"
              - Sid: StackSetsServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringLike:
                    iam:AWSServiceName: "*stacksets.cloudformation.amazonaws.com"
              # ActivateOrganizationsAccess also reads the StackSets service-linked roles.
              - Sid: StackSetsServiceLinkedRoleRead
                Effect: Allow
                Action: iam:GetRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*"
              - Sid: MemberRollout
                Effect: Allow
                Action:
                  - cloudformation:CreateStackSet
                  - cloudformation:UpdateStackSet
                  - cloudformation:DeleteStackSet
                  - cloudformation:DescribeStackSet
                  - cloudformation:CreateStackInstances
                  - cloudformation:DeleteStackInstances
                  - cloudformation:ListStackInstances
                  - cloudformation:ListStackSetOperations
                  - cloudformation:ListStackSetOperationResults
                  - cloudformation:DescribeStackSetOperation
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stackset/cloudoptics-resource-access:*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stackset-target/cloudoptics-resource-access:*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:*::type/resource/*"

  SetupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Cloudoptics setup step (source in infra/cloudformation/setup/access_setup.py).
      Runtime: python3.12
      Handler: index.handler
      Timeout: 900
      Role: !GetAtt SetupRole.Arn
      Code:
        ZipFile: |
          # Cloudoptics setup step for cloudoptics-access.yaml. Runs in the customer's account as a
          # CloudFormation custom resource; Cloudoptics never assumes its role. The template carries
          # this file inline (tests check the two match). Actions:
          #   cleanup: on create, remove the older Cloudoptics stacks that hold the same role names.
          #   bucket:  create the bill export bucket, or reuse it when an earlier stack left it behind.
          #   setup:   roll the resource role out to member accounts when this is an Organization's
          #            management account, then tell Cloudoptics the stack is ready (or gone).
          import contextlib
          import json
          import time
          import urllib.error
          import urllib.request

          import boto3
          import cfnresponse
          from botocore.exceptions import ClientError

          STACKSET = "cloudoptics-resource-access"
          # The StackSet stack first: if it cannot be removed, the billing role is still in place.
          OLD_STACKS = (
              "cloudoptics-resource-stackset",
              "cloudoptics-resource-access",
              "cloudoptics-billing-access",
          )
          REGIONS = ["us-east-1"]  # IAM is global: one region is enough
          PREFS = {
              "RegionConcurrencyType": "PARALLEL",
              "MaxConcurrentPercentage": 100,
              "FailureTolerancePercentage": 100,
          }
          DENIED = ("AccessDenied", "AccessDeniedException")
          ORG_ACCESS_TRIES = 12  # about 6 minutes, inside the function's 15
          # Kept back from the function's timeout for the callback and the reply to CloudFormation:
          # without a reply the stack waits an hour and then fails with no reason.
          RESERVE_SECONDS = 120
          _deadline = None


          def time_left():
              return float("inf") if _deadline is None else _deadline - time.time()


          class _Retrying:
              """A boto3 client whose calls retry AccessDenied for two minutes: a role created moments
              ago can be refused until IAM has propagated it."""

              def __init__(self, client):
                  self._client = client

              def __getattr__(self, name):
                  attr = getattr(self._client, name)
                  if not callable(attr) or name == "get_waiter":
                      return attr

                  def call(*args, **kwargs):
                      for attempt in range(12):
                          try:
                              return attr(*args, **kwargs)
                          except ClientError as exc:
                              if _code(exc) not in DENIED or attempt == 11 or time_left() < 30:
                                  raise
                              time.sleep(10)
                      return None

                  return call


          def client(name):
              return _Retrying(boto3.client(name))


          def _code(exc):
              return exc.response.get("Error", {}).get("Code")


          def handler(event, context):
              global _deadline
              if context is not None:
                  _deadline = time.time() + context.get_remaining_time_in_millis() / 1000 - RESERVE_SECONDS
              props = event["ResourceProperties"]
              physical = event.get("PhysicalResourceId") or "cloudoptics-" + props["Action"]
              try:
                  data = ACTIONS[props["Action"]](event["RequestType"], props) or {}
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, data, physical)
              except Exception as exc:  # report every failure to CloudFormation
                  reason = f"{type(exc).__name__}: {exc}"[:900]
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, physical, reason=reason)


          def _missing(exc):
              return _code(exc) in ("ValidationError", "StackSetNotFoundException")


          def cleanup(kind, props):
              if kind != "Create":
                  return None
              cfn = client("cloudformation")
              removed = []
              for name in OLD_STACKS:
                  try:
                      [stack] = cfn.describe_stacks(StackName=name)["Stacks"]
                  except ClientError as exc:
                      if _missing(exc):
                          continue
                      raise
                  if stack["StackStatus"] == "DELETE_COMPLETE":
                      continue
                  cfn.delete_stack(StackName=name)
                  try:
                      cfn.get_waiter("stack_delete_complete").wait(
                          StackName=name, WaiterConfig={"Delay": 10, "MaxAttempts": 80}
                      )
                  except Exception as exc:
                      raise RuntimeError(
                          f"Could not remove the old stack {name}. "
                          "Delete it in CloudFormation, then try again."
                      ) from exc
                  removed.append(name)
              return {"Removed": ",".join(removed)}


          def bucket_policy(bucket, account):
              arns = [f"arn:aws:s3:::{bucket}", f"arn:aws:s3:::{bucket}/*"]
              return {
                  "Version": "2012-10-17",
                  "Statement": [
                      {
                          "Sid": "AllowBcmDataExportsDelivery",
                          "Effect": "Allow",
                          "Principal": {
                              "Service": ["bcm-data-exports.amazonaws.com", "billingreports.amazonaws.com"]
                          },
                          "Action": ["s3:PutObject", "s3:GetBucketPolicy"],
                          "Resource": arns,
                          "Condition": {
                              "StringLike": {
                                  "aws:SourceAccount": account,
                                  "aws:SourceArn": [
                                      f"arn:aws:cur:us-east-1:{account}:definition/*",
                                      f"arn:aws:bcm-data-exports:us-east-1:{account}:export/*",
                                  ],
                              }
                          },
                      },
                      {
                          "Sid": "DenyInsecureTransport",
                          "Effect": "Deny",
                          "Principal": "*",
                          "Action": "s3:*",
                          "Resource": arns,
                          "Condition": {"Bool": {"aws:SecureTransport": "false"}},
                      },
                  ],
              }


          def bucket(kind, props):
              name = props["BucketName"]
              if kind == "Delete":
                  return {"BucketName": name}  # kept on purpose, like the bills in it
              s3 = client("s3")
              try:
                  s3.head_bucket(Bucket=name, ExpectedBucketOwner=props["AccountId"])
                  reused = True
              except ClientError as exc:
                  if _code(exc) not in ("404", "NoSuchBucket", "NotFound"):
                      raise RuntimeError(
                          f"The S3 bucket name {name} belongs to another AWS account."
                      ) from exc
                  s3.create_bucket(Bucket=name)
                  reused = False
              s3.put_public_access_block(
                  Bucket=name,
                  PublicAccessBlockConfiguration={
                      "BlockPublicAcls": True,
                      "BlockPublicPolicy": True,
                      "IgnorePublicAcls": True,
                      "RestrictPublicBuckets": True,
                  },
              )
              s3.put_bucket_ownership_controls(
                  Bucket=name, OwnershipControls={"Rules": [{"ObjectOwnership": "BucketOwnerEnforced"}]}
              )
              s3.put_bucket_encryption(
                  Bucket=name,
                  ServerSideEncryptionConfiguration={
                      "Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]
                  },
              )
              s3.put_bucket_lifecycle_configuration(
                  Bucket=name,
                  LifecycleConfiguration={
                      "Rules": [
                          {
                              "ID": "expire-old-exports",
                              "Status": "Enabled",
                              "Filter": {"Prefix": ""},
                              "Expiration": {"Days": 400},
                          }
                      ]
                  },
              )
              s3.put_bucket_policy(Bucket=name, Policy=json.dumps(bucket_policy(name, props["AccountId"])))
              return {"BucketName": name, "Reused": str(reused).lower()}


          def organization():
              try:
                  return client("organizations").describe_organization()["Organization"]
              except ClientError as exc:
                  if _code(exc) == "AWSOrganizationsNotInUseException":
                      return None
                  raise


          def trusted_access():
              """Turn on StackSets trusted access in AWS Organizations.

              Always asked for, even when it reads as on: the status can say ENABLED before
              StackSets will create a service-managed stack set, and asking again is harmless.
              """
              cfn = client("cloudformation")
              # Only CloudFormation can turn it on (enabling the service in Organizations is not enough).
              # It needs iam:CreateServiceLinkedRole and iam:GetRole for the StackSets service-linked role.
              cfn.activate_organizations_access()
              for _ in range(12):
                  if cfn.describe_organizations_access()["Status"] == "ENABLED" or time_left() < 60:
                      break
                  time.sleep(5)


          def _no_org_access(exc):
              return _code(exc) == "ValidationError" and "organizations access" in str(exc).lower()


          def with_org_access(call, tries=ORG_ACCESS_TRIES):
              """StackSets can take minutes to see newly enabled trusted access: ask again and wait."""
              for attempt in range(tries):
                  try:
                      return call()
                  except ClientError as exc:
                      if not _no_org_access(exc) or attempt == tries - 1 or time_left() < 120:
                          raise
                  trusted_access()
                  time.sleep(30)
              return None


          def root_id():
              trusted_access()
              return client("organizations").list_roots()["Roots"][0]["Id"]


          def wait_operation(cfn, operation_id):
              for _ in range(80):
                  op = cfn.describe_stack_set_operation(StackSetName=STACKSET, OperationId=operation_id)
                  if op["StackSetOperation"]["Status"] not in ("RUNNING", "QUEUED", "STOPPING"):
                      return
                  if time_left() < 60:
                      raise TimeoutError(f"StackSet operation {operation_id} is still running")
                  time.sleep(10)


          def wait_idle(cfn):
              for op in cfn.list_stack_set_operations(StackSetName=STACKSET)["Summaries"]:
                  if op["Status"] in ("RUNNING", "QUEUED", "STOPPING"):
                      wait_operation(cfn, op["OperationId"])


          def ensure_stackset(props, root):
              cfn = client("cloudformation")
              params = [
                  {"ParameterKey": "ExternalId", "ParameterValue": props["ExternalId"]},
                  {
                      "ParameterKey": "CloudopticsPrincipalArn",
                      "ParameterValue": props["CloudopticsPrincipalArn"],
                  },
                  {"ParameterKey": "RoleName", "ParameterValue": "CloudopticsResourceReader"},
              ]
              try:
                  cfn.describe_stack_set(StackSetName=STACKSET)
                  exists = True
              except ClientError as exc:
                  if not _missing(exc):
                      raise
                  exists = False
              if exists:
                  wait_idle(cfn)
                  op = with_org_access(
                      lambda: cfn.update_stack_set(
                          StackSetName=STACKSET,
                          TemplateURL=props["ResourceTemplateUrl"],
                          Parameters=params,
                          Capabilities=["CAPABILITY_NAMED_IAM"],
                          OperationPreferences=PREFS,
                      )
                  )
                  wait_operation(cfn, op["OperationId"])
                  if cfn.list_stack_instances(StackSetName=STACKSET)["Summaries"]:
                      return
              else:
                  with_org_access(
                      lambda: cfn.create_stack_set(
                          StackSetName=STACKSET,
                          Description="Read-only resource role for Cloudoptics in every member account.",
                          TemplateURL=props["ResourceTemplateUrl"],
                          Parameters=params,
                          Capabilities=["CAPABILITY_NAMED_IAM"],
                          PermissionModel="SERVICE_MANAGED",
                          AutoDeployment={"Enabled": True, "RetainStacksOnAccountRemoval": False},
                          ManagedExecution={"Active": True},
                      )
                  )
              # Not waited for: member accounts show up in Cloudoptics as the rollout reaches them.
              with_org_access(
                  lambda: cfn.create_stack_instances(
                      StackSetName=STACKSET,
                      DeploymentTargets={"OrganizationalUnitIds": [root]},
                      Regions=REGIONS,
                      OperationPreferences=PREFS,
                  )
              )


          def remove_stackset():
              cfn = client("cloudformation")
              try:
                  cfn.describe_stack_set(StackSetName=STACKSET)
              except ClientError as exc:
                  if _missing(exc):
                      return
                  raise
              wait_idle(cfn)
              if cfn.list_stack_instances(StackSetName=STACKSET)["Summaries"]:
                  root = client("organizations").list_roots()["Roots"][0]["Id"]
                  op = cfn.delete_stack_instances(
                      StackSetName=STACKSET,
                      DeploymentTargets={"OrganizationalUnitIds": [root]},
                      Regions=REGIONS,
                      RetainStacks=False,
                      OperationPreferences=PREFS,
                  )
                  wait_operation(cfn, op["OperationId"])
              cfn.delete_stack_set(StackSetName=STACKSET)


          def callback(kind, props, management, rollout=None):
              body = json.dumps(
                  {
                      "requestType": kind,
                      "ref": props["ConnectionRef"],
                      "tenantId": props["TenantId"],
                      "externalId": props["ExternalId"],
                      "accountId": props["AccountId"],
                      "management": management,
                      "curBucket": props["BucketName"],
                      "curPrefix": props["CurPrefix"],
                      "stackName": props["StackName"],
                      "templateVersion": props["TemplateVersion"],
                      "memberRollout": rollout,
                  }
              ).encode()
              error = "no answer"
              for delay in (0, 3, 10):
                  time.sleep(delay)
                  request = urllib.request.Request(  # noqa: S310 - our https URL
                      props["CallbackUrl"],
                      data=body,
                      method="POST",
                      headers={"Content-Type": "application/json"},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20):  # noqa: S310 - our https URL
                          return
                  except urllib.error.HTTPError as exc:
                      detail = exc.read().decode(errors="replace")
                      with contextlib.suppress(ValueError, AttributeError):
                          detail = json.loads(detail).get("title") or detail
                      error = f"HTTP {exc.code} {detail[:300]}"
                      if exc.code < 500:
                          break
                  except Exception as exc:
                      error = f"{type(exc).__name__}: {exc}"
              if kind == "Create":
                  raise RuntimeError(f"Cloudoptics did not accept this account ({error}).")
              print(f"callback failed, ignored on {kind}: {error}")


          def setup(kind, props):
              org = organization()
              management = org is not None and org["MasterAccountId"] == props["AccountId"]
              if kind == "Delete":
                  if management:
                      # A rollout left behind is taken over by the next stack, so it never blocks a delete.
                      try:
                          remove_stackset()
                      except Exception as exc:
                          print(f"member rollout not removed: {type(exc).__name__}: {exc}")
                  callback(kind, props, management)
                  return None
              if not management:
                  rollout = "not an Organization's management account"
              elif org.get("FeatureSet") != "ALL":
                  # Service-managed StackSets need all features, not only consolidated billing.
                  rollout = (
                      "skipped: turn on all features in AWS Organizations, then update this stack "
                      "to give member accounts their read-only role"
                  )
              else:
                  # Billing and this account's resource role work without it, so a failed rollout
                  # does not undo the whole stack; updating the stack tries the rollout again.
                  try:
                      ensure_stackset(props, root_id())
                      rollout = "started"
                  except Exception as exc:
                      rollout = f"failed: {type(exc).__name__}: {exc}"[:400]
                      print(f"member rollout {rollout}")
              callback(kind, props, management, rollout)
              return {"Management": str(management).lower(), "MemberRollout": rollout}


          ACTIONS = {"cleanup": cleanup, "bucket": bucket, "setup": setup}

  CleanUp:
    Type: Custom::CloudopticsCleanUp
    Properties:
      ServiceToken: !GetAtt SetupFunction.Arn
      # Just over the function's 900 seconds, so a missing reply fails fast, not after an hour.
      ServiceTimeout: "960"
      Action: cleanup

  CurBucket:
    Type: Custom::CloudopticsBucket
    DependsOn: CleanUp
    Properties:
      ServiceToken: !GetAtt SetupFunction.Arn
      # Just over the function's 900 seconds, so a missing reply fails fast, not after an hour.
      ServiceTimeout: "960"
      Action: bucket
      BucketName: !Sub "cloudoptics-cur-${AWS::AccountId}"
      AccountId: !Ref AWS::AccountId

  BillingRole:
    Type: AWS::IAM::Role
    DependsOn: CleanUp
    Properties:
      RoleName: CloudopticsBillingReader
      Description: Read-only billing access for Cloudoptics. No write actions.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref CloudopticsPrincipalArn }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { sts:ExternalId: !Ref ExternalId }
      Policies:
        - PolicyName: cloudoptics-billing-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CostExplorerAndCommitments
                Effect: Allow
                Action:
                  - ce:Get*
                  - ce:Describe*
                  - ce:List*
                  - savingsplans:Describe*
                  - budgets:ViewBudget
                  - pricing:GetProducts
                  - pricing:DescribeServices
                Resource: "*"
              - Sid: ExportsAndOrganization
                Effect: Allow
                Action:
                  - bcm-data-exports:GetExport
                  - bcm-data-exports:ListExports
                  - bcm-data-exports:GetExecution
                  - bcm-data-exports:ListExecutions
                  - cur:DescribeReportDefinitions
                  - organizations:DescribeOrganization
                  - organizations:ListAccounts
                Resource: "*"
              - Sid: ReadExportBucketOnly
                Effect: Allow
                Action: [s3:GetObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::cloudoptics-cur-${AWS::AccountId}"
                  - !Sub "arn:${AWS::Partition}:s3:::cloudoptics-cur-${AWS::AccountId}/*"

  ResourceRole:
    Type: AWS::IAM::Role
    DependsOn: CleanUp
    Properties:
      RoleName: CloudopticsResourceReader
      Description: Read-only resource metadata and metrics for Cloudoptics. No write actions.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref CloudopticsPrincipalArn }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { sts:ExternalId: !Ref ExternalId }
      Policies:
        - PolicyName: cloudoptics-resource-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Inventory
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - rds:Describe*
                  - rds:ListTagsForResource
                  - elasticloadbalancing:Describe*
                  - autoscaling:Describe*
                  - lambda:ListFunctions
                  - lambda:ListProvisionedConcurrencyConfigs
                  - lambda:GetFunctionConfiguration
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - logs:DescribeLogGroups
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketTagging
                  - s3:GetLifecycleConfiguration
                  - s3:GetIntelligentTieringConfiguration
                  - tag:GetResources
                  - route53:ListHostedZones
                  - route53:ListResourceRecordSets
                Resource: "*"
              - Sid: Metrics
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                Resource: "*"
              - Sid: AwsNativeRecommendations
                Effect: Allow
                Action:
                  - compute-optimizer:Get*
                  - compute-optimizer:Describe*
                  - cost-optimization-hub:Get*
                  - cost-optimization-hub:List*
                Resource: "*"

  CurExport:
    Type: AWS::BCMDataExports::Export
    Properties:
      Export:
        Name: cloudoptics-cur2
        Description: CUR 2.0 for Cloudoptics (hourly, resource IDs, Parquet)
        DataQuery:
          QueryStatement: >-
            SELECT identity_line_item_id, identity_time_interval, bill_bill_type,
            bill_billing_entity, bill_billing_period_start_date, bill_billing_period_end_date,
            bill_payer_account_id, bill_payer_account_name, line_item_usage_account_id,
            line_item_usage_account_name, line_item_line_item_type, line_item_product_code,
            line_item_usage_type, line_item_operation, line_item_resource_id,
            line_item_availability_zone, line_item_usage_start_date, line_item_usage_end_date,
            line_item_usage_amount, line_item_unblended_rate, line_item_unblended_cost,
            line_item_blended_cost, line_item_net_unblended_cost, line_item_currency_code,
            line_item_line_item_description, pricing_public_on_demand_cost, pricing_unit,
            product_region_code, product_instance_type, product_servicecode, product,
            resource_tags, savings_plan_savings_plan_a_r_n,
            savings_plan_savings_plan_effective_cost, reservation_reservation_a_r_n,
            reservation_effective_cost FROM COST_AND_USAGE_REPORT
          TableConfigurations:
            COST_AND_USAGE_REPORT:
              TIME_GRANULARITY: HOURLY
              INCLUDE_RESOURCES: "TRUE"
              INCLUDE_SPLIT_COST_ALLOCATION_DATA: "FALSE"
              INCLUDE_MANUAL_DISCOUNT_COMPATIBILITY: "FALSE"
        DestinationConfigurations:
          S3Destination:
            S3Bucket: !GetAtt CurBucket.BucketName
            S3Prefix: !Ref CurPrefix
            S3Region: us-east-1
            S3OutputConfigurations:
              OutputType: CUSTOM
              Format: PARQUET
              Compression: PARQUET
              Overwrite: OVERWRITE_REPORT
        RefreshCadence:
          Frequency: SYNCHRONOUS


  Setup:
    Type: Custom::CloudopticsSetup
    DependsOn: [BillingRole, ResourceRole, CurExport]
    Properties:
      ServiceToken: !GetAtt SetupFunction.Arn
      # Just over the function's 900 seconds, so a missing reply fails fast, not after an hour.
      ServiceTimeout: "960"
      Action: setup
      # A new version number makes every update run the setup step (and the callback) again.
      TemplateVersion: "2.0.0"
      StackName: !Ref AWS::StackName
      AccountId: !Ref AWS::AccountId
      ExternalId: !Ref ExternalId
      CloudopticsPrincipalArn: !Ref CloudopticsPrincipalArn
      ResourceTemplateUrl: !Ref ResourceTemplateUrl
      CallbackUrl: !Ref CallbackUrl
      ConnectionRef: !Ref ConnectionRef
      TenantId: !Ref TenantId
      BucketName: !GetAtt CurBucket.BucketName
      CurPrefix: !Ref CurPrefix

Outputs:
  TemplateVersion:
    Value: "2.0.0"
  BillingRoleArn:
    Value: !GetAtt BillingRole.Arn
  ResourceRoleArn:
    Value: !GetAtt ResourceRole.Arn
  CurBucketName:
    Value: !GetAtt CurBucket.BucketName
  CurExportArn:
    Value: !GetAtt CurExport.ExportArn
  OrganizationManagementAccount:
    Value: !GetAtt Setup.Management
  MemberRollout:
    Description: The read-only role for member accounts. Update the stack to try again if it failed.
    Value: !GetAtt Setup.MemberRollout
