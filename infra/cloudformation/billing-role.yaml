AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Cloudoptics stage 1 (required): read-only billing access for the payer or a standalone
  account, plus an optional CUR 2.0 export. No write permissions are granted to Cloudoptics.
  Deploy in us-east-1 (BCM Data Exports is a us-east-1 service). PRD FR-CON-02/03/13.

Metadata:
  cloudoptics:
    templateVersion: "1.0.0"
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Connection (pre-filled by Cloudoptics) }
        Parameters: [ExternalId, CloudopticsPrincipalArn]
      - Label: { default: Cost and Usage Report }
        Parameters: [CreateCurExport, ExistingCurBucketName, CurPrefix]

Parameters:
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 32
    MaxLength: 128
    AllowedPattern: "[\\w+=,.@:/-]+"
    Description: Unique to your Cloudoptics workspace. Do not reuse.
  CloudopticsPrincipalArn:
    Type: String
    AllowedPattern: "arn:aws:iam::[0-9]{12}:role/[\\w+=,.@-]+"
    Description: The Cloudoptics role allowed to assume this role.
  CreateCurExport:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Create an S3 bucket and a CUR 2.0 export for Cloudoptics.
  ExistingCurBucketName:
    Type: String
    Default: ""
    Description: If you already have a CUR 2.0 export, the bucket it writes to.
  CurPrefix:
    Type: String
    Default: cloudoptics
    AllowedPattern: "[a-zA-Z0-9!_.*'()/-]+"

Conditions:
  CreateExport: !Equals [!Ref CreateCurExport, "true"]
  HasExistingBucket: !Not [!Equals [!Ref ExistingCurBucketName, ""]]
  HasAnyBucket: !Or [!Condition CreateExport, !Condition HasExistingBucket]

Resources:
  CurBucket:
    Type: AWS::S3::Bucket
    Condition: CreateExport
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "cloudoptics-cur-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-exports
            Status: Enabled
            ExpirationInDays: 400

  CurBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateExport
    Properties:
      Bucket: !Ref CurBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBcmDataExportsDelivery
            Effect: Allow
            Principal:
              Service: [bcm-data-exports.amazonaws.com, billingreports.amazonaws.com]
            Action: [s3:PutObject, s3:GetBucketPolicy]
            Resource: [!GetAtt CurBucket.Arn, !Sub "${CurBucket.Arn}/*"]
            Condition:
              StringLike:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn:
                  - !Sub "arn:aws:cur:us-east-1:${AWS::AccountId}:definition/*"
                  - !Sub "arn:aws:bcm-data-exports:us-east-1:${AWS::AccountId}:export/*"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt CurBucket.Arn, !Sub "${CurBucket.Arn}/*"]
            Condition:
              Bool: { aws:SecureTransport: "false" }

  CurExport:
    Type: AWS::BCMDataExports::Export
    Condition: CreateExport
    DependsOn: CurBucketPolicy
    Properties:
      Export:
        Name: cloudoptics-cur2
        Description: CUR 2.0 for Cloudoptics (hourly, resource IDs, Parquet)
        DataQuery:
          QueryStatement: >-
            SELECT identity_line_item_id, identity_time_interval, bill_bill_type,
            bill_billing_entity, bill_billing_period_start_date, bill_billing_period_end_date,
            bill_payer_account_id, bill_payer_account_name, line_item_usage_account_id,
            line_item_usage_account_name, line_item_line_item_type, line_item_product_code,
            line_item_usage_type, line_item_operation, line_item_resource_id,
            line_item_availability_zone, line_item_usage_start_date, line_item_usage_end_date,
            line_item_usage_amount, line_item_unblended_rate, line_item_unblended_cost,
            line_item_blended_cost, line_item_net_unblended_cost, line_item_currency_code,
            line_item_line_item_description, pricing_public_on_demand_cost, pricing_unit,
            product_region_code, product_instance_type, product_servicecode, product,
            resource_tags, savings_plan_savings_plan_a_r_n,
            savings_plan_savings_plan_effective_cost, reservation_reservation_a_r_n,
            reservation_effective_cost FROM COST_AND_USAGE_REPORT
          TableConfigurations:
            COST_AND_USAGE_REPORT:
              TIME_GRANULARITY: HOURLY
              INCLUDE_RESOURCES: "TRUE"
              INCLUDE_SPLIT_COST_ALLOCATION_DATA: "FALSE"
              INCLUDE_MANUAL_DISCOUNT_COMPATIBILITY: "FALSE"
        DestinationConfigurations:
          S3Destination:
            S3Bucket: !Ref CurBucket
            S3Prefix: !Ref CurPrefix
            S3Region: us-east-1
            S3OutputConfigurations:
              OutputType: CUSTOM
              Format: PARQUET
              Compression: PARQUET
              Overwrite: OVERWRITE_REPORT
        RefreshCadence:
          Frequency: SYNCHRONOUS

  BillingRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn-lint:
        config:
          # The existing-bucket ARN is only used when ExistingCurBucketName is non-empty.
          ignore_checks: [W1031]
    Properties:
      RoleName: CloudopticsBillingReadOnly
      Description: Read-only billing access for Cloudoptics. No write actions.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref CloudopticsPrincipalArn }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { sts:ExternalId: !Ref ExternalId }
      Policies:
        - PolicyName: cloudoptics-billing-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CostExplorerAndCommitments
                Effect: Allow
                Action:
                  - ce:Get*
                  - ce:Describe*
                  - ce:List*
                  - savingsplans:Describe*
                  - budgets:ViewBudget
                  - pricing:GetProducts
                  - pricing:DescribeServices
                Resource: "*"
              - Sid: ExportsAndOrganization
                Effect: Allow
                Action:
                  - bcm-data-exports:GetExport
                  - bcm-data-exports:ListExports
                  - bcm-data-exports:GetExecution
                  - bcm-data-exports:ListExecutions
                  - cur:DescribeReportDefinitions
                  - organizations:DescribeOrganization
                  - organizations:ListAccounts
                Resource: "*"
              - !If
                - HasAnyBucket
                - Sid: ReadExportBucketOnly
                  Effect: Allow
                  Action: [s3:GetObject, s3:ListBucket, s3:GetBucketLocation]
                  Resource:
                    - !If
                      - CreateExport
                      - !GetAtt CurBucket.Arn
                      - !Sub "arn:aws:s3:::${ExistingCurBucketName}"
                    - !If
                      - CreateExport
                      - !Sub "${CurBucket.Arn}/*"
                      - !Sub "arn:aws:s3:::${ExistingCurBucketName}/*"
                - !Ref AWS::NoValue

Outputs:
  RoleArn:
    Value: !GetAtt BillingRole.Arn
  CurBucketName:
    Condition: HasAnyBucket
    Value: !If [CreateExport, !Ref CurBucket, !Ref ExistingCurBucketName]
  CurExportArn:
    Condition: CreateExport
    Value: !GetAtt CurExport.ExportArn
