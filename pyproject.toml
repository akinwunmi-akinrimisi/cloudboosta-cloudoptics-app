[project]
name = "cloudoptics-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["cloudoptics-api", "cur-fixture"]

[dependency-groups]
dev = [
    "boto3-stubs[bcm-data-exports,ce,ec2,organizations,s3,sts]>=1.43.117",
    "httpx>=0.27",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pyarrow-stubs>=17",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "tools/cur-fixture"]

[tool.uv.sources]
cloudoptics-api = { workspace = true }
cur-fixture = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101"]  # assert is the pytest idiom

[tool.ruff.lint.per-file-ignores]
"apps/api/migrations/**" = ["S608"]  # DDL built from module constants, no input

[tool.ruff.lint.isort]
known-first-party = ["cloudoptics", "cur_fixture"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["apps/api/src", "tools/cur-fixture/src"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "tools/cur-fixture/tests"]
addopts = "-q --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
