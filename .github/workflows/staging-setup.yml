# One-off / occasional setup of staging's external services (ADR-007, ADR-013, ADR-006):
#   1. Cloudoptics' AWS account: template bucket, broker role, broker user (key rotated).
#   2. App Platform: broker key, template URLs, WorkOS client ID and API key, and the
#      Postmark server token (POSTMARK_API) and sender (POSTMARK_FROM) when present.
# Run it by hand from main (Actions -> Staging setup -> Run workflow). It reads credentials
# from a GitHub environment. AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, WORKOS_API_KEY,
# DIGITALOCEAN_TOKEN and POSTMARK_API must be secrets: GitHub masks secrets in logs but not
# variables, and this repository's logs are public. Each secret is given only to the steps
# that use it. WORKOS_CLIENT_ID and POSTMARK_FROM are not secret and may be variables.
name: Staging setup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment that holds the credentials
        default: github-pages
        required: true

permissions:
  contents: read

concurrency:
  group: staging-setup
  cancel-in-progress: false

jobs:
  setup:
    name: AWS account, sign-in and App Platform settings
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      # Not secret: a secret or a variable.
      WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID || vars.WORKOS_CLIENT_ID }}
      POSTMARK_FROM: ${{ secrets.POSTMARK_FROM || vars.POSTMARK_FROM }}
      APP_URL: https://cloudoptics.cloudboosta.com
    steps:
      - name: Check the credentials are present
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          missing=""
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY WORKOS_API_KEY DIGITALOCEAN_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -n "$WORKOS_CLIENT_ID" ] || missing="$missing WORKOS_CLIENT_ID (secret or variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing in environment '$ENVIRONMENT':$missing (add as secrets)"
            exit 1
          fi
      - name: Check the Postmark token works
        # Optional: email alerts are logged, not sent, until a Postmark server token is set.
        env:
          POSTMARK_API: ${{ secrets.POSTMARK_API }}
        run: |
          if [ -z "$POSTMARK_API" ]; then
            echo "POSTMARK_API is not set; emails will be logged, not sent."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Accept: application/json" \
            -H "X-Postmark-Server-Token: $POSTMARK_API" "https://api.postmarkapp.com/server")
          if [ "$code" != 200 ]; then
            echo "::error::Postmark rejected POSTMARK_API (HTTP $code). Use a Server API token (Postmark -> your server -> API Tokens)."
            exit 1
          fi
      - name: Check the WorkOS API key works
        # The API reads each user's email with this key; a key from another WorkOS
        # environment makes every sign-in fail after the redirect.
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $WORKOS_API_KEY" \
            "https://api.workos.com/user_management/users?limit=1")
          if [ "$code" != 200 ]; then
            echo "::error::WorkOS rejected WORKOS_API_KEY (HTTP $code). Use the API key from the same WorkOS environment as WORKOS_CLIENT_ID."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --all-packages --locked
      - name: Set up Cloudoptics' AWS account
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: uv run python infra/aws/bootstrap.py
      - name: Apply settings to App Platform and deploy
        # Also reads the broker key, role ARN and template URLs bootstrap.py wrote to GITHUB_ENV.
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          POSTMARK_API: ${{ secrets.POSTMARK_API }}
        run: uv run python infra/digitalocean/provision.py app
      - name: Wait for the deployment
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          app=3294882e-35ce-45b0-bb33-e7ce55062f22
          for i in $(seq 1 60); do
            phase=$(curl -sSf -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/apps/$app/deployments?per_page=1" | jq -r '.deployments[0].phase')
            echo "phase: $phase"
            case "$phase" in ACTIVE) break ;; ERROR|CANCELED) exit 1 ;; esac
            sleep 20
          done
          [ "$phase" = ACTIVE ]
      - name: Smoke test
        run: |
          curl -sSf "$APP_URL/api/readyz"
          echo
          curl -sSf "$APP_URL/api/v1/auth/config" | tee /dev/stderr | jq -e '.provider == "workos"'
          curl -sSf -o /dev/null "$CLOUDOPTICS_CFN_BILLING_TEMPLATE_URL"
          echo "templates reachable at $CLOUDOPTICS_CFN_BILLING_TEMPLATE_URL"
