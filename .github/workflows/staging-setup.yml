# One-off / occasional setup of staging's external services (ADR-007, ADR-013, ADR-006):
#   1. Cloudoptics' AWS account: template bucket, broker role, and the broker's credentials:
#      the broker user (key rotated) or IAM Roles Anywhere (certificate rotated); with the
#      kms input, the KMS key for connection secrets (owner steps: ADR-007 amendment,
#      docs/11g RB-20).
#   2. App Platform: broker key, template URLs, WorkOS client ID and API key, and the
#      Postmark server token (POSTMARK_API) and sender (POSTMARK_FROM) when present; the
#      app spec's alert rules, and with ALERT_EMAILS their recipients and uptime checks.
# Run it by hand from main (Actions -> Staging setup -> Run workflow). It reads credentials
# from a GitHub environment. AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, WORKOS_API_KEY,
# DIGITALOCEAN_TOKEN and POSTMARK_API must be secrets: GitHub masks secrets in logs but not
# variables, and this repository's logs are public. Each secret is given only to the steps
# that use it. WORKOS_CLIENT_ID and POSTMARK_FROM are not secret and may be variables.
name: Staging setup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment that holds the credentials
        default: github-pages
        required: true
      kms:
        description: >-
          KMS envelope encryption of connection secrets. off: unchanged. optional: create
          the key and encrypt new secrets with it. required: refuse to start without it
          (only after the re-encryption job reports nothing left).
        type: choice
        options: ["off", optional, required]
        default: "off"
      broker_credentials:
        description: >-
          How the broker gets AWS credentials. iam-user: rotate the user's key (fallback).
          roles-anywhere: issue a new short-lived certificate and use IAM Roles Anywhere.
        type: choice
        options: [iam-user, roles-anywhere]
        default: iam-user
      certificate_days:
        description: Days the Roles Anywhere certificate is valid (1-90); re-run before then.
        default: "30"
        required: true
      azure_certificate:
        description: >-
          Rotate the Cloudoptics Entra app's certificate (ADR-020) and deploy it. Needs the
          AZURE_* variables and the deployer app's federated credential (owner steps).
        type: boolean
        default: false
      delete_broker_user:
        description: >-
          With roles-anywhere: delete the IAM user and its key. Only once Roles Anywhere
          has been seen working on staging.
        type: boolean
        default: false

permissions:
  contents: read
  # ADR-020: the GitHub OIDC token signs the deployer in to Entra (no Azure secret).
  id-token: write

concurrency:
  group: staging-setup
  cancel-in-progress: false

jobs:
  setup:
    name: AWS account, sign-in and App Platform settings
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      # Not secret: a secret or a variable.
      WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID || vars.WORKOS_CLIENT_ID }}
      POSTMARK_FROM: ${{ secrets.POSTMARK_FROM || vars.POSTMARK_FROM }}
      APP_URL: https://cloudoptics.cloudboosta.com
    steps:
      - name: Check the credentials are present
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          missing=""
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY WORKOS_API_KEY DIGITALOCEAN_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -n "$WORKOS_CLIENT_ID" ] || missing="$missing WORKOS_CLIENT_ID (secret or variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing in environment '$ENVIRONMENT':$missing (add as secrets)"
            exit 1
          fi
      - name: Check the Postmark token works
        # Optional: email alerts are logged, not sent, until a Postmark server token is set.
        env:
          POSTMARK_API: ${{ secrets.POSTMARK_API }}
        run: |
          if [ -z "$POSTMARK_API" ]; then
            echo "POSTMARK_API is not set; emails will be logged, not sent."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Accept: application/json" \
            -H "X-Postmark-Server-Token: $POSTMARK_API" "https://api.postmarkapp.com/server")
          if [ "$code" != 200 ]; then
            echo "::error::Postmark rejected POSTMARK_API (HTTP $code). Use a Server API token (Postmark -> your server -> API Tokens)."
            exit 1
          fi
      - name: Check the WorkOS API key works
        # The API reads each user's email with this key; a key from another WorkOS
        # environment makes every sign-in fail after the redirect.
        env:
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $WORKOS_API_KEY" \
            "https://api.workos.com/user_management/users?limit=1")
          if [ "$code" != 200 ]; then
            echo "::error::WorkOS rejected WORKOS_API_KEY (HTTP $code). Use the API key from the same WorkOS environment as WORKOS_CLIENT_ID."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --all-packages --locked
      - name: Set up Cloudoptics' AWS account
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          KMS_MODE: ${{ inputs.kms }}
          BROKER_CREDENTIALS: ${{ inputs.broker_credentials }}
          CERTIFICATE_DAYS: ${{ inputs.certificate_days }}
          DELETE_BROKER_USER: ${{ inputs.delete_broker_user }}
        run: uv run python infra/aws/bootstrap.py
      - name: Rotate the Azure app certificate
        if: inputs.azure_certificate
        # Not secret: IDs only. The private key it makes is masked and goes to GITHUB_ENV.
        env:
          AZURE_DIRECTORY_ID: ${{ vars.AZURE_DIRECTORY_ID }}
          AZURE_DEPLOYER_CLIENT_ID: ${{ vars.AZURE_DEPLOYER_CLIENT_ID }}
          AZURE_APP_OBJECT_ID: ${{ vars.AZURE_APP_OBJECT_ID }}
          AZURE_APP_CLIENT_ID: ${{ vars.AZURE_APP_CLIENT_ID }}
          AZURE_CERTIFICATE_DAYS: ${{ inputs.certificate_days }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          app=3294882e-35ce-45b0-bb33-e7ce55062f22
          # The running app's certificate stays on the Entra app until the new one is live.
          CURRENT_AZURE_CERTIFICATE=$(curl -sSf -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
            "https://api.digitalocean.com/v2/apps/$app" | jq -r '[.app.spec.services[]?.envs[]? |
            select(.key == "CLOUDOPTICS_AZURE_CERTIFICATE") | .value][0] // ""')
          export CURRENT_AZURE_CERTIFICATE
          uv run python infra/azure/entra_certificate.py
      - name: Apply settings to App Platform and deploy
        # Also reads what bootstrap.py wrote to GITHUB_ENV: the broker key or Roles Anywhere
        # certificate (the private key masked), role ARN, KMS key and template URLs.
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          POSTMARK_API: ${{ secrets.POSTMARK_API }}
          # Optional, comma-separated: recipients of the App Platform alerts and uptime
          # checks (WBS OPS-7). Each must be a member of the DigitalOcean team. A secret, so
          # the addresses are masked in this public repository's logs.
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          # ADR-021: the "Connect DigitalOcean" OAuth app. The client ID may be a variable or a secret;
          # the client secret must be a secret. Unset: onboarding offers only the token paste.
          CLOUDOPTICS_DO_OAUTH_CLIENT_ID: ${{ vars.CLOUDOPTICS_DO_OAUTH_CLIENT_ID || secrets.CLOUDOPTICS_DO_OAUTH_CLIENT_ID }}
          CLOUDOPTICS_DO_OAUTH_CLIENT_SECRET: ${{ secrets.CLOUDOPTICS_DO_OAUTH_CLIENT_SECRET }}
          # ADR-019: the two values infra/gcp/setup.sh prints (variables: not secret).
          # Unset: the Google Cloud wizard says Google Cloud is not switched on.
          CLOUDOPTICS_GCP_WORKLOAD_PROVIDER: ${{ vars.CLOUDOPTICS_GCP_WORKLOAD_PROVIDER }}
          CLOUDOPTICS_GCP_SERVICE_ACCOUNT_PROJECT: ${{ vars.CLOUDOPTICS_GCP_SERVICE_ACCOUNT_PROJECT }}
        run: uv run python infra/digitalocean/provision.py app
      - name: Wait for the deployment
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          app=3294882e-35ce-45b0-bb33-e7ce55062f22
          for i in $(seq 1 60); do
            phase=$(curl -sSf -H "Authorization: Bearer $DIGITALOCEAN_TOKEN" \
              "https://api.digitalocean.com/v2/apps/$app/deployments?per_page=1" | jq -r '.deployments[0].phase')
            echo "phase: $phase"
            case "$phase" in ACTIVE) break ;; ERROR|CANCELED) exit 1 ;; esac
            sleep 20
          done
          [ "$phase" = ACTIVE ]
      - name: Smoke test
        run: |
          curl -sSf "$APP_URL/api/readyz"
          echo
          curl -sSf "$APP_URL/api/v1/auth/config" | tee /dev/stderr | jq -e '.provider == "workos"'
          curl -sSf -o /dev/null "$CLOUDOPTICS_CFN_BILLING_TEMPLATE_URL"
          echo "templates reachable at $CLOUDOPTICS_CFN_BILLING_TEMPLATE_URL"
          # Site at /, app at /app, demo at /demo, /cfn from the site (docs/14 §7.2, SITE-13).
          scripts/check-staging-layout.sh "$APP_URL"
