# Redeploys staging on DigitalOcean App Platform (ADR-013) after main publishes a new image.
# Needs the repository secret DIGITALOCEAN_TOKEN; skips cleanly when it is not set.
name: Deploy staging

on:
  workflow_run:
    workflows: [Container]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  APP_ID: 3294882e-35ce-45b0-bb33-e7ce55062f22
  APP_URL: https://cloudoptics.cloudboosta.com

jobs:
  deploy:
    name: Deploy to App Platform
    # The branches filter above matches the triggering run's head branch, which a fork's pull
    # request also controls (Container runs on pull_request). Deploy only after a successful
    # Container run for a push to main of this repository, or when run by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://cloudoptics.cloudboosta.com
    steps:
      # App Platform has no admission policy (the role Kyverno plays on Kubernetes, WBS
      # OPS-9), so the deploy checks that the image this Container run built was signed by the
      # Container workflow on main, and that main still points to it, before App Platform pulls it.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3 (cosign v3.1.4)
      - name: Verify the image signature
        id: verify
        env:
          TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/cloudoptics-api
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/container.yml@refs/heads/main
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$TOKEN" ]; then exit 0; fi  # the next step skips the deploy
          issuer=https://token.actions.githubusercontent.com
          if [ -z "$BUILT_SHA" ]; then
            # Run by hand: deploy whatever main points to, if it is signed.
            cosign verify "$IMAGE:main" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$issuer" > /dev/null
            echo "$IMAGE:main is signed by container.yml on main"
            exit 0
          fi
          # Check the image this Container run built (its sha- tag), not the moving main tag:
          # with merges seconds apart, main can already point to the next build, whose
          # signature is not attached yet (deploy run 44592266617, 19 Nov 2026).
          built=$(cosign verify "$IMAGE:sha-$BUILT_SHA" --certificate-identity "$IDENTITY"             --certificate-oidc-issuer "$issuer" | jq -r '.[0].critical.image."docker-manifest-digest"')
          current=$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Manifest}}' | jq -r .digest)
          echo "built $BUILT_SHA = $built; main = $current"
          if [ "$built" != "$current" ]; then
            # App Platform pulls the main tag. A newer build has moved it; that build's own
            # Container run triggers its own deploy once it is signed.
            echo "::notice::main has moved past $BUILT_SHA; the newer build deploys itself."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start deployment
        id: start
        env:
          TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          if [ "${{ steps.verify.outputs.superseded }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$TOKEN" ]; then
            echo "::warning::DIGITALOCEAN_TOKEN is not set; skipping the staging deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          id=$(curl -sSf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"force_build": true}' "https://api.digitalocean.com/v2/apps/$APP_ID/deployments" \
            | jq -r .deployment.id)
          echo "deployment=$id" >> "$GITHUB_OUTPUT"
      - name: Wait until active
        if: steps.start.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DEPLOYMENT: ${{ steps.start.outputs.deployment }}
        run: |
          for i in $(seq 1 60); do
            phase=$(curl -sSf -H "Authorization: Bearer $TOKEN" \
              "https://api.digitalocean.com/v2/apps/$APP_ID/deployments/$DEPLOYMENT" | jq -r .deployment.phase)
            echo "phase: $phase"
            case "$phase" in
              ACTIVE) break ;;
              ERROR|CANCELED|SUPERSEDED) exit 1 ;;
            esac
            sleep 20
          done
          [ "$phase" = ACTIVE ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.start.outputs.skip != 'true'
        with:
          sparse-checkout: scripts
      - name: Smoke test
        if: steps.start.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          curl -sSf "$APP_URL/api/readyz"
          curl -sSf -o /dev/null "$APP_URL/"
          # This workflow redeploys the spec already on App Platform; the path layout of
          # docs/14 §7.2 (SITE-13) arrives when Staging setup applies infra/digitalocean/app.yaml.
          # Once the app has the site component, check that layout too.
          if curl -sSf -H "Authorization: Bearer $TOKEN" "https://api.digitalocean.com/v2/apps/$APP_ID"               | jq -e '[.app.spec.static_sites[]?.name] | index("site")' > /dev/null; then
            scripts/check-staging-layout.sh "$APP_URL"
          fi
