# Builds the API/worker image on every PR and publishes it to GitHub Container Registry
# from main (ADR-012). DigitalOcean later pulls the same image.
# Images pushed from main are signed with cosign keyless (Sigstore, GitHub OIDC) and get an
# SPDX SBOM attestation (WBS OPS-9). Deploy staging (deploy-staging.yml) starts when this
# workflow succeeds and verifies the signature before it deploys; to verify by hand see
# docs/11g_runbooks_and_operational_readiness.md RB-08.
name: Container

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    name: API image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cloudoptics-api
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sign:
    # Only pushes from main publish an image. The OIDC token (id-token: write) is given to
    # this job alone: cosign exchanges it for a short-lived Sigstore certificate that names
    # this workflow and ref, so there is no signing key to store or rotate.
    name: Sign image and attach SBOM
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # signatures and attestations are stored next to the image in GHCR
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cloudoptics-api@${{ needs.image.outputs.digest }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/container.yml@${{ github.ref }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3 (cosign v3.1.4)
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign (keyless)
        # By digest, never by tag: the tag can move, the digest cannot.
        run: cosign sign --yes "$IMAGE"
      - name: Verify the signature
        run: |
          cosign verify "$IMAGE" --certificate-identity "$IDENTITY"             --certificate-oidc-issuer "$ISSUER" > /dev/null
          echo "signature verified for $IMAGE"
      - name: SBOM of the pushed image (SPDX)
        id: sbom
        # Best effort: an SBOM or Sigstore hiccup must not stop the staging deploy, which
        # waits for this workflow. The signature above is the required part.
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          artifact-name: image-sbom.spdx.json
      - name: Attest the SBOM
        if: steps.sbom.outcome == 'success'
        continue-on-error: true
        run: |
          cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$IMAGE"
